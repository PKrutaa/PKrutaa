name: Update profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check statistics
        run: python -m unittest discover -s tests -v
      - name: Generate statistics
        run: python scripts/generate_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: PKrutaa
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#238636&color_dots=#ebedf0,#d3efda,#9dd8ae,#58ac71,#287c42
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#b9f6ca&color_dots=#161b22,#183d2b,#276343,#3f9161,#7bd99c
      - name: Publish profile images
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
